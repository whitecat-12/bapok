<style>
:root{
  --blue:#3b82f6;--blue-soft:#60a5fa;--blue-bright:#38bdf8;--blue-pale:#dbeafe;--blue-deep:#2563eb;
  --green:#10b981;--green-pale:#d1fae5;--green-deep:#047857;
  --rose:#f43f5e;--rose-pale:#ffe4e6;--rose-deep:#be123c;
  --violet:#8b5cf6;--violet-pale:#ede9fe;--violet-deep:#6d28d9;
  --amber:#f59e0b;--amber-pale:#fef3c7;--amber-deep:#92400e;
  --teal:#14b8a6;--teal-deep:#0d9488;--teal-pale:#ccfbf1;
  --surface:#ffffff;--surface-2:#f8fbff;--surface-3:#f0f7ff;
  --text:#0b1220;--text-soft:#475569;--text-mute:#94a3b8;--line:#e6efff;
  --r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --shadow-xs:0 1px 2px rgba(59,130,246,.05);
  --shadow-sm:0 2px 6px rgba(59,130,246,.07);
  --shadow:0 4px 16px rgba(59,130,246,.09), 0 1px 4px rgba(15,23,42,.03);
  --shadow-lg:0 16px 40px rgba(59,130,246,.15), 0 6px 12px rgba(15,23,42,.05);
  --shadow-blue:0 14px 30px rgba(59,130,246,.32);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#e8f1ff;color:var(--text);font-size:12.5px;line-height:1.45;height:100vh;height:100dvh;overflow:hidden;display:flex;justify-content:center;align-items:stretch;font-feature-settings:"cv02","cv03","cv04","cv11";letter-spacing:-0.011em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(1000px 700px at 15% 0%, #e0efff 0%, transparent 55%),radial-gradient(900px 600px at 100% 20%, #e6f3ff 0%, transparent 55%),radial-gradient(700px 700px at 50% 110%, #d6ecff 0%, transparent 55%),#eff6ff;pointer-events:none}
.app{width:100%;max-width:100%;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;position:relative;z-index:1;display:flex;flex-direction:column;padding:0 0 calc(140px + env(safe-area-inset-bottom));opacity:0;transform:translateY(16px) scale(0.985);transition:opacity 0.9s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);pointer-events:none;scrollbar-gutter:stable}
body.app-ready .app{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
@media (min-width: 720px){
  body{padding:20px 16px;align-items:flex-start}
  .app{max-width:420px;height:calc(100dvh - 40px);border-radius:32px;box-shadow:0 32px 64px rgba(59,130,246,.2), 0 6px 20px rgba(15,23,42,.08);background:rgba(239,246,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
}
#splashScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 50% 42%, #1e3a8a 0%, #1e40af 30%, #0b1220 100%);transition:opacity 0.6s cubic-bezier(.7,0,.3,1), visibility 0.6s}
#splashScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;text-align:center}
.splash-logo{position:relative;width:110px;height:110px;border-radius:28px;background:linear-gradient(145deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);display:grid;place-items:center;color:#fff;font-size:44px;box-shadow:0 24px 48px rgba(37,99,235,.6)}
.splash-title{font-size:24px;font-weight:800;color:#fff;display:flex;gap:2px}
.splash-subtitle{font-size:11px;font-weight:600;color:rgba(191,219,254,.85);letter-spacing:0.35em;text-transform:uppercase;margin-top:2px}
.splash-loader{width:180px;height:4px;background:rgba(147,197,253,.2);border-radius:99px;overflow:hidden;margin-top:14px}
.splash-loader-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg, #60a5fa, #3b82f6, #38bdf8);transition:width 0.35s}
.splash-loading-text{font-size:10px;color:rgba(191,219,254,.7);font-weight:600;margin-top:10px;min-height:14px}

.auth-screen{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(239,246,255,.97);backdrop-filter:blur(16px);overflow-y:auto}
.auth-screen.show{display:flex}
.auth-card{width:100%;max-width:380px;background:#fff;border-radius:24px;padding:26px 20px 20px;box-shadow:var(--shadow-lg)}
.auth-msg{font-size:11px;font-weight:600;line-height:1.5;margin:2px 0 12px;display:none;padding:9px 12px;border-radius:10px}
.auth-msg.show{display:block}
.auth-msg.err{background:var(--rose-pale);color:var(--rose-deep)}
.auth-msg.ok{background:var(--green-pale);color:var(--green-deep)}
.auth-panel{display:none}
.auth-panel.show{display:block}
.auth-switch{text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--text-mute);font-weight:500}

.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;background:linear-gradient(180deg, rgba(239,246,255,.95) 0%, rgba(239,246,255,.75) 70%, rgba(239,246,255,0) 100%);backdrop-filter:blur(16px)}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:14px;flex-shrink:0;box-shadow:0 6px 14px rgba(59,130,246,.4)}
.brand-text h1{font-size:14px;font-weight:700;color:var(--text);line-height:1.2;display:flex;align-items:center;gap:6px}
.brand-text p{font-size:10.5px;color:var(--text-mute);font-weight:500;margin-top:1px}
.topbar-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.topbar-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:var(--blue-deep);font-size:13px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.topbar-btn.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:0 6px 14px rgba(245,158,11,.4)}
.topbar-btn.violet{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 6px 14px rgba(139,92,246,.4)}

.admin-mode-banner{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;padding:10px 14px;margin:0 14px 10px;border-radius:14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(245,158,11,.3)}
.admin-mode-banner.show{display:flex}
.admin-mode-banner i{font-size:16px}
.admin-mode-banner .info{flex:1;min-width:0}
.admin-mode-banner .lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;opacity:.85}
.admin-mode-banner .nm{font-size:12.5px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-mode-banner .exit-btn{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 10px;border-radius:9px;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0}

.main{flex:1;padding:2px 14px 0;width:100%}
.view{display:none}
.view.active{display:block}
.hero{background:var(--blue);border-radius:var(--r-lg);padding:16px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-blue)}
.hero-shop{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;opacity:.95;margin-bottom:8px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);width:fit-content}
.hero-label{font-size:10px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;opacity:.85}
.hero-value{font-size:clamp(22px, 7vw, 28px);font-weight:800;margin-top:6px;line-height:1.1;word-break:break-word}
.hero-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:600;margin-top:10px}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bento-item{background:var(--surface);border-radius:var(--r-md);padding:10px 11px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:7px;min-width:0}
.bento-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.bento-icon.blue{background:var(--blue-pale);color:var(--blue-deep)}
.bento-icon.green{background:var(--green-pale);color:var(--green-deep)}
.bento-icon.red{background:var(--rose-pale);color:var(--rose-deep)}
.bento-icon.violet{background:var(--violet-pale);color:var(--violet-deep)}
.bento-value{font-size:15px;font-weight:800;color:var(--text);line-height:1.1}
.bento-label{font-size:9.5px;color:var(--text-mute);font-weight:600}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 8px}
.section-head h2{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.section-head h2 i{font-size:11px;color:var(--blue)}
.section-head .count{font-size:10.5px;color:var(--text-mute);font-weight:500}
.chip-button{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:none;background:var(--blue-pale);color:var(--blue-deep);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer}
.list{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.list-item{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer;min-height:54px}
.list-item + .list-item{border-top:1px solid var(--line)}
.list-avatar{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;flex-shrink:0;overflow:hidden}
.list-avatar.in{background:var(--green-pale);color:var(--green-deep)}
.list-avatar.out{background:var(--rose-pale);color:var(--rose-deep)}
.list-avatar.prod{background:var(--blue-pale);color:var(--blue-deep)}
.list-avatar.violet{background:var(--violet-pale);color:var(--violet-deep)}
.list-avatar.teal{background:var(--teal-pale);color:var(--teal-deep)}
.list-avatar img{width:100%;height:100%;object-fit:cover}
.list-body{flex:1;min-width:0}
.list-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.35;word-break:break-word}
.list-sub{font-size:10px;color:var(--text-mute);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-weight:500}
.list-trailing{text-align:right;flex-shrink:0}
.list-amount{font-size:11.5px;font-weight:700;white-space:nowrap}
.list-amount.best{color:var(--green-deep)}
.list-amount.worst{color:var(--rose-deep)}
.list-meta{font-size:9.5px;color:var(--text-mute);margin-top:2px;font-weight:500}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border-radius:12px;padding:0 14px;height:40px;margin-bottom:10px;box-shadow:var(--shadow-sm);border:1.5px solid transparent}
.search:focus-within{border-color:var(--blue)}
.search i{color:var(--text-mute);font-size:12px;flex-shrink:0}
.search input{border:none;outline:none;flex:1;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--text);min-width:0}
.empty{text-align:center;padding:36px 20px}
.empty-icon{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;background:var(--blue-pale);color:var(--blue);display:grid;place-items:center;font-size:22px}
.empty h3{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.empty p{font-size:11px;line-height:1.55;color:var(--text-mute);max-width:240px;margin:0 auto 14px;font-weight:500}
.btn-text{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:11px;border:none;background:var(--blue-pale);color:var(--blue-deep);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}

.product{background:var(--surface);border-radius:var(--r-md);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:pointer;position:relative}
.product-top{display:flex;align-items:flex-start;gap:10px}
.product-icon{width:36px;height:36px;border-radius:11px;background:var(--blue-pale);color:var(--blue-deep);display:grid;place-items:center;font-size:13px;flex-shrink:0;overflow:hidden}
.product-icon img{width:100%;height:100%;object-fit:cover}
.product-info{flex:1;min-width:0}
.product-name{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.3;word-break:break-word}
.product-meta{font-size:10px;color:var(--text-mute);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;font-weight:600}
.product-meta span{display:inline-flex;align-items:center;gap:3px}
.product-actions{display:flex;gap:1px;flex-shrink:0}
.icon-btn-sm{width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--text-mute);font-size:11px;cursor:pointer;display:grid;place-items:center}
.icon-btn-sm.danger:hover{background:var(--rose-pale);color:var(--rose-deep)}
.stock-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:9.5px;font-weight:700;margin-top:7px}
.stock-tag.ok{background:var(--green-pale);color:var(--green-deep)}
.stock-tag.low{background:var(--amber-pale);color:var(--amber-deep)}
.stock-tag.empty{background:var(--rose-pale);color:var(--rose-deep)}
.product-prices{display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.product-prices.single{grid-template-columns:1fr 1fr}
.price-cell{text-align:center;min-width:0}
.price-label{font-size:8.5px;color:var(--text-mute);font-weight:700;text-transform:uppercase}
.price-value{font-size:11px;font-weight:700;margin-top:3px;color:var(--text);word-break:break-word}
.price-value.pos{color:var(--green-deep)}
.price-value.neg{color:var(--rose-deep)}
.price-value .unit{display:block;font-size:9px;font-weight:500;color:var(--text-mute);margin-top:1px}

.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.fin-card{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow-sm);display:flex;gap:10px;align-items:flex-start}
.fin-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.fin-income .fin-icon{background:var(--green-pale);color:var(--green-deep)}
.fin-expense .fin-icon{background:var(--rose-pale);color:var(--rose-deep)}
.fin-label{font-size:9.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase}
.fin-value{font-size:13.5px;font-weight:800;margin-top:3px}
.fin-income .fin-value{color:var(--green-deep)}
.fin-expense .fin-value{color:var(--rose-deep)}
.fin-sub{font-size:9.5px;color:var(--text-mute);margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.profit-banner{background:linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);border-radius:var(--r-md);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-blue);color:#fff;margin-bottom:10px}
.profit-icon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.profit-label{font-size:9.5px;font-weight:700;opacity:.85;text-transform:uppercase}
.profit-value{font-size:18px;font-weight:800;margin-top:3px}
.profit-value-sm{font-size:12.5px;font-weight:800;margin-top:3px}

.chart-card{background:var(--surface);border-radius:var(--r-md);padding:14px 12px 10px;box-shadow:var(--shadow-sm);margin-bottom:8px}
.chart-title{font-size:10.5px;font-weight:800;color:var(--text-soft);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.chart-title i{color:var(--blue);font-size:10.5px}
.chart-title .hint{font-weight:500;color:var(--text-mute);text-transform:none;font-size:9.5px;margin-left:auto}
.chart-card canvas{width:100% !important;height:210px !important;display:block}
.chart-select{font-family:inherit;font-size:10px;font-weight:700;padding:4px 8px;border-radius:8px;border:none;background:var(--blue-pale);color:var(--blue-deep);cursor:pointer;outline:none;margin-left:auto;max-width:130px}

.table-wrap{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-sm);overflow:hidden}
.table-scroll{overflow-x:auto;overflow-y:auto;max-height:460px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px;min-width:420px}
thead th{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,#f8fbff 0%,#eef6ff 100%);padding:11px 12px;font-size:9px;font-weight:800;color:var(--text-soft);text-transform:uppercase;border-bottom:1.5px solid var(--line);text-align:left}
thead th.num{text-align:right}
thead th.center{text-align:center}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);font-weight:500;color:var(--text)}
td.num{text-align:right;font-weight:700;white-space:nowrap}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1.5px solid var(--line);background:linear-gradient(180deg,#f8fbff,#f0f7ff)}
.table-foot .tf-label{font-size:9.5px;font-weight:700;color:var(--text-mute);text-transform:uppercase}
.table-foot .tf-value{font-size:12.5px;font-weight:800;color:var(--blue-deep)}

.cmp-hero{background:linear-gradient(135deg,#10b981 0%,#047857 100%);border-radius:var(--r-md);padding:14px 16px;color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cmp-hero.tied{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-deep) 100%)}
.cmp-hero-icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.cmp-hero-label{font-size:9.5px;font-weight:700;opacity:.85;text-transform:uppercase}
.cmp-hero-name{font-size:15px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-hero-price{text-align:right;flex-shrink:0}
.cmp-hero-price .p{font-size:16px;font-weight:800;margin-top:3px}
.cmp-list{display:flex;flex-direction:column;gap:8px}
.cmp-card{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--shadow-sm);border-left:3px solid var(--line);cursor:pointer}
.cmp-card.best{border-left-color:var(--green)}
.cmp-card.worst{border-left-color:var(--rose)}
.cmp-card.mid{border-left-color:var(--amber)}
.cmp-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cmp-rank{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12.5px;flex-shrink:0;overflow:hidden}
.cmp-rank img{width:100%;height:100%;object-fit:cover}
.cmp-rank.gold{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#fff}
.cmp-rank.silver{background:linear-gradient(135deg,#e2e8f0,#94a3b8);color:#fff}
.cmp-rank.bronze{background:linear-gradient(135deg,#d97706,#92400e);color:#fff}
.cmp-rank.normal{background:var(--surface-3);color:var(--text-mute);border:1px solid var(--line)}
.cmp-info{flex:1;min-width:0}
.cmp-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-addr{font-size:9.5px;color:var(--text-mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cmp-price-col{text-align:right;flex-shrink:0;padding-left:8px}
.cmp-price{font-size:14px;font-weight:800}
.cmp-price.best{color:var(--green-deep)}
.cmp-price.worst{color:var(--rose-deep)}
.cmp-price.mid{color:var(--text)}
.cmp-price.tie{color:var(--blue-deep)}
.cmp-diff{font-size:9.5px;font-weight:800;margin-top:4px}
.cmp-diff.pos{color:var(--green-deep)}
.cmp-diff.neg{color:var(--rose-deep)}
.cmp-diff.neutral{color:var(--amber-deep)}
.cmp-diff.tie{color:var(--blue-deep)}
.cmp-bar-wrap{margin-top:10px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.cmp-bar{height:100%;border-radius:99px}
.cmp-bar.best{background:linear-gradient(90deg,#34d399,#10b981)}
.cmp-bar.mid{background:linear-gradient(90deg,#fbbf24,#f59e0b)}
.cmp-bar.worst{background:linear-gradient(90deg,#fb7185,#f43f5e)}
.cmp-bar.tie{background:linear-gradient(90deg,#60a5fa,#3b82f6)}

.uploading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:3}
.history-photo-hero{width:100%;max-height:200px;object-fit:cover;border-radius:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(59,130,246,.15);display:block}
.info-hero-icon.photo{background:var(--surface-3);padding:0;overflow:hidden}

.clear-price-check{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--amber-pale);border-radius:10px;cursor:pointer;border:1.5px solid rgba(245,158,11,.25);margin-bottom:10px}
.clear-price-check input[type=checkbox]{margin-top:2px;width:16px;height:16px;accent-color:var(--amber);flex-shrink:0}
.clear-price-check span{font-size:10.5px;font-weight:600;color:var(--amber-deep);line-height:1.45}

.badge-role{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:800;background:var(--violet-pale);color:var(--violet-deep);letter-spacing:0.3px;margin-left:auto;flex-shrink:0}
.badge-role.admin{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.badge-role.agen{background:var(--violet-pale);color:var(--violet-deep)}
.badge-role.petugas{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff}

.fb-info-box{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:10.5px;line-height:1.55;color:var(--text-soft);font-weight:500;margin-bottom:10px}

.fb-info-box code{background:var(--blue-pale);color:var(--blue-deep);padding:1px 6px;border-radius:5px;font-family:ui-monospace,monospace;font-size:10px;font-weight:700}

.manual-select-wrap{display:flex;gap:6px;align-items:stretch}
.manual-select-wrap .field-wrap{flex:1;margin-bottom:0}
.manual-add-btn{flex-shrink:0;width:auto!important;padding:0 14px!important;height:40px}
.manual-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:9px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;margin-left:6px;vertical-align:middle}

.unit-detect{display:flex;align-items:center;gap:9px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid rgba(16,185,129,.3);border-radius:11px;padding:9px 11px;margin-bottom:11px}
.unit-detect .ud-icon{width:26px;height:26px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px;flex-shrink:0}
.unit-detect .ud-body-wrap{flex:1;min-width:0}
.unit-detect .ud-title{font-size:9.5px;font-weight:800;color:var(--green-deep);text-transform:uppercase;letter-spacing:.3px}
.unit-detect .ud-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.det-chip{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--green-deep);padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800}
.det-chip i{font-size:9px}
.unit-detect .ud-apply{flex-shrink:0;font-family:inherit;font-size:10px;font-weight:800;padding:6px 10px;border-radius:8px;border:none;background:var(--green);color:#fff;cursor:pointer}

.sim-card{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:6px;cursor:pointer;border-left:3px solid var(--amber);transition:transform .15s}
.sim-card:active{transform:scale(.99)}
.sim-card .sim-top{display:flex;align-items:center;gap:9px}
.sim-card .sim-score{flex-shrink:0;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--green-pale);color:var(--green-deep)}
.sim-card .sim-score.med{background:var(--amber-pale);color:var(--amber-deep)}

.name-warn{display:flex;align-items:center;gap:9px;background:var(--amber-pale);border:1.5px solid rgba(245,158,11,.5);border-radius:11px;padding:9px 11px;margin-bottom:11px;font-size:11px;font-weight:600;color:var(--amber-deep);line-height:1.4;animation:nwSlide .25s ease}
@keyframes nwSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.name-warn.exact{background:var(--rose-pale);border-color:rgba(244,63,94,.5);color:var(--rose-deep)}
.name-warn i{font-size:13px;flex-shrink:0;margin-top:1px}
.name-warn .nw-text{flex:1;min-width:0;word-break:break-word}
.name-warn .nw-text b{font-weight:800}
.name-warn .nw-use{flex-shrink:0;font-family:inherit;font-size:10px;font-weight:800;padding:6px 11px;border-radius:8px;border:none;cursor:pointer;background:var(--green);color:#fff;box-shadow:0 4px 10px rgba(16,185,129,.35);display:inline-flex;align-items:center;gap:4px}

.merge-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.merge-btn{font-family:inherit;font-size:10.5px;font-weight:800;padding:8px 10px;border-radius:9px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;background:var(--blue-pale);color:var(--blue-deep);transition:all .15s}
.merge-btn:hover{background:var(--blue);color:#fff}
.merge-btn i{font-size:10px}
.merge-btn.warn{background:var(--amber-pale);color:var(--amber-deep)}
.merge-btn.warn:hover{background:var(--amber);color:#fff}

.group-count-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--violet-pale);color:var(--violet-deep);font-size:8.5px;font-weight:800;margin-left:4px}

.report-block{background:var(--surface);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.report-block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rbh-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.rbh-icon.blue{background:var(--blue-pale);color:var(--blue-deep)}
.rbh-icon.amber{background:var(--amber-pale);color:var(--amber-deep)}
.rbh-icon.violet{background:var(--violet-pale);color:var(--violet-deep)}
.rbh-icon.green{background:var(--green-pale);color:var(--green-deep)}
.rbh-body{flex:1;min-width:0}
.rbh-body h3{font-size:12.5px;font-weight:800;color:var(--text);line-height:1.2}
.rbh-body p{font-size:10px;color:var(--text-mute);font-weight:600;margin-top:2px}
.rbh-badge{font-size:8.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;letter-spacing:0.4px;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.rbh-badge i{font-size:8px}
.rbh-reset{font-family:inherit;font-size:10px;font-weight:800;padding:6px 11px;border-radius:9px;border:none;background:var(--surface-3);color:var(--text-soft);cursor:pointer;display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.rbh-reset:hover{background:var(--blue-pale);color:var(--blue-deep)}

.filter-grid{display:flex;flex-direction:column;gap:10px}
.filter-group{background:var(--surface-2);border-radius:12px;padding:10px}
.filter-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.filter-label > span:first-child{font-size:10px;font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.3px;display:inline-flex;align-items:center;gap:5px}
.filter-label > span:first-child i{font-size:9px;color:var(--blue)}
.filter-count{font-size:9.5px;font-weight:800;color:var(--blue-deep);background:var(--blue-pale);padding:2px 8px;border-radius:999px}
.filter-actions{display:flex;gap:4px;margin-bottom:8px}
.filter-actions button{font-family:inherit;font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:7px;border:none;background:var(--surface);color:var(--text-soft);cursor:pointer;transition:all .15s}
.filter-actions button:hover{background:var(--blue-pale);color:var(--blue-deep)}
.filter-group .chip-select{max-height:118px}

.manual-toolbar{display:flex;gap:6px;margin-bottom:8px}
.manual-toolbar .select{flex:1;padding:10px 32px 10px 34px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600}
.manual-toolbar .select:focus{border-color:var(--blue);background:#fff}
.manual-toolbar .btn{width:auto;flex-shrink:0}
.manual-actions{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.manual-actions .btn-mini{font-family:inherit;font-size:10px;font-weight:700;padding:6px 11px;border-radius:8px;border:none;background:var(--surface-3);color:var(--text-soft);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.manual-actions .btn-mini:hover{background:var(--blue-pale);color:var(--blue-deep)}
.manual-actions .manual-count{margin-left:auto;font-size:10px;font-weight:700;color:var(--text-mute)}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi-card{background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:7px;position:relative;overflow:hidden;border:1px solid var(--line)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--blue)}
.kpi-card.kpi-low::before{background:linear-gradient(90deg,var(--green),var(--green-deep))}
.kpi-card.kpi-high::before{background:linear-gradient(90deg,var(--rose),var(--rose-deep))}
.kpi-card.kpi-save::before{background:linear-gradient(90deg,var(--blue),var(--blue-deep))}
.kpi-card.kpi-avg::before{background:linear-gradient(90deg,var(--violet),var(--violet-deep))}
.kpi-icon{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.kpi-card.kpi-low .kpi-icon{background:var(--green-pale);color:var(--green-deep)}
.kpi-card.kpi-high .kpi-icon{background:var(--rose-pale);color:var(--rose-deep)}
.kpi-card.kpi-save .kpi-icon{background:var(--blue-pale);color:var(--blue-deep)}
.kpi-card.kpi-avg .kpi-icon{background:var(--violet-pale);color:var(--violet-deep)}
.kpi-label{font-size:9px;font-weight:800;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.3px}
.kpi-value{font-size:14.5px;font-weight:800;color:var(--text);line-height:1.15;margin-top:3px;word-break:break-word}
.kpi-card.kpi-low .kpi-value{color:var(--green-deep)}
.kpi-card.kpi-high .kpi-value{color:var(--rose-deep)}
.kpi-card.kpi-save .kpi-value{color:var(--blue-deep)}
.kpi-card.kpi-avg .kpi-value{color:var(--violet-deep)}
.kpi-sub{font-size:9.5px;color:var(--text-mute);font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chart-block{background:var(--surface);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.chart-block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cbh-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.cbh-icon.blue{background:var(--blue-pale);color:var(--blue-deep)}
.cbh-body{flex:1;min-width:0}
.cbh-body h3{font-size:12px;font-weight:800;color:var(--text);line-height:1.2}
.cbh-body p{font-size:9.5px;color:var(--text-mute);font-weight:600;margin-top:2px}
.chart-card-new{background:var(--surface-2);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
.chart-card-new:last-child{margin-bottom:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chart-head > span:first-child{font-size:10.5px;font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:0.3px;display:inline-flex;align-items:center;gap:5px}
.chart-head > span:first-child i{color:var(--blue);font-size:10px}
.chart-hint{font-size:9px;font-weight:600;color:var(--text-mute);text-transform:none;letter-spacing:0}
.chart-card-new canvas{width:100%!important;height:200px!important;display:block}

.table-block{background:var(--surface);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.table-block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tbh-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.tbh-icon.violet{background:var(--violet-pale);color:var(--violet-deep)}
.tbh-body{flex:1;min-width:0}
.tbh-body h3{font-size:12px;font-weight:800;color:var(--text);line-height:1.2}
.tbh-body p{font-size:9.5px;color:var(--text-mute);font-weight:600;margin-top:2px}
.table-block .table-wrap{box-shadow:none;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-block .table-scroll{max-height:420px;border-radius:14px 14px 0 0}
.table-block .table-foot{border-radius:0 0 14px 14px}

.export-block{background:var(--surface);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.export-block-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ebh-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.ebh-icon.green{background:var(--green-pale);color:var(--green-deep)}
.ebh-body{flex:1;min-width:0}
.ebh-body h3{font-size:12px;font-weight:800;color:var(--text);line-height:1.2}
.ebh-body p{font-size:9.5px;color:var(--text-mute);font-weight:600;margin-top:2px}

.export-grid-new{display:flex;flex-direction:column;gap:8px}
.export-card{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;background:var(--surface-2);cursor:pointer;border:1.5px solid var(--line);transition:all .15s}
.export-card:hover{border-color:var(--blue-pale);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.export-card:active{transform:translateY(0)}
.export-card.main{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.05));border-color:rgba(59,130,246,.2)}
.export-card .ec-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.ec-icon.pdf{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;box-shadow:0 4px 10px rgba(220,38,38,.3)}
.ec-icon.violet{background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff}
.ec-icon.blue{background:var(--blue-pale);color:var(--blue-deep)}
.ec-icon.red{background:var(--rose-pale);color:var(--rose-deep)}
.ec-body{flex:1;min-width:0}
.ec-body h4{font-size:11.5px;font-weight:800;color:var(--text);line-height:1.2}
.ec-body p{font-size:9.5px;color:var(--text-mute);font-weight:500;margin-top:2px}
.ec-arrow{color:var(--text-mute);font-size:10px;flex-shrink:0}
.export-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.export-card.small{flex-direction:column;align-items:flex-start;gap:8px;padding:10px}
.export-card.small .ec-body h4{font-size:10px}
.export-card.small .ec-icon{width:32px;height:32px;font-size:13px;border-radius:9px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#bfdbfe;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   DESKTOP LAYOUT — PC / WINDOWS  (min-width: 1024px)
   Semua perubahan terisolasi di media query ini.
   Di bawah 1024px tampilan mobile/tablet lama tetap utuh.
   ============================================================ */
@media (min-width: 1024px) {

  /* --- Body & app --- */
  body {
    padding: 0 !important;
    display: block !important;
    background: #f5f9ff;
  }
  body::before {
    background:
      radial-gradient(1400px 900px at 0% 0%, #e8f1ff 0%, transparent 60%),
      radial-gradient(1200px 800px at 100% 100%, #eaf4ff 0%, transparent 55%),
      #f5f9ff;
  }

  .app {
    margin-left: 240px !important;
    width: calc(100% - 240px) !important;
    max-width: none !important;
    height: 100vh !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    padding: 0 !important;
    display: flex !important;
    flex-direction: column;
    overflow-y: auto;
  }

  /* --- Dock → Sidebar kiri --- */
  .dock {
    position: fixed !important;
    top: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    right: auto !important;
    margin: 0 !important;
    width: 240px !important;
    max-width: 240px !important;
    height: 100vh !important;
    border-radius: 0 !important;
    padding: 20px 14px !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    align-items: stretch !important;
    gap: 4px !important;
    background: #ffffff !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    box-shadow: none !important;
    border-right: 1px solid var(--line) !important;
    overflow-y: auto;
  }
  .dock::before {
    content: 'bapok';
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--blue-deep);
    padding: 4px 14px 18px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .nav-item {
    flex-direction: row !important;
    justify-content: flex-start !important;
    align-items: center !important;
    gap: 12px !important;
    padding: 11px 14px !important;
    width: 100% !important;
    min-height: 44px;
    border-radius: 10px !important;
    color: var(--text-soft) !important;
    transition: all 0.15s ease;
  }
  .nav-item i { font-size: 16px !important; width: 20px; text-align: center; }
  .nav-item span { font-size: 13.5px !important; font-weight: 600 !important; }
  .nav-item:hover { background: var(--blue-pale) !important; color: var(--blue-deep) !important; }
  .nav-item.active {
    color: #fff !important;
    background: var(--blue) !important;
    box-shadow: 0 4px 12px rgba(59,130,246,.3) !important;
  }
  .nav-item.active:hover { background: var(--blue-deep) !important; }

  /* --- Topbar --- */
  .topbar {
    padding: 16px 32px !important;
    margin: 0 !important;
    background: rgba(255,255,255,0.9) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    border-radius: 0 !important;
  }
  .brand-logo { width: 40px; height: 40px; font-size: 16px; }
  .brand-text h1 { font-size: 16px; }
  .brand-text p { font-size: 11.5px; }
  .topbar-btn { width: 40px; height: 40px; font-size: 15px; }

  .admin-mode-banner { margin: 16px 32px 0 !important; }

  /* --- Main --- */
  .main {
    padding: 22px 32px 40px !important;
    width: 100%;
  }

  /* --- Hero --- */
  .hero { padding: 26px 30px !important; }
  .hero-value { font-size: 34px !important; }
  .hero-label { font-size: 11.5px; }
  .hero-chip { font-size: 12px; padding: 6px 12px; }

  /* --- Bento 4 kolom --- */
  .bento {
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 12px !important;
  }
  .bento-item { padding: 14px 16px; }
  .bento-value { font-size: 20px; }
  .bento-label { font-size: 11px; }
  .bento-icon { width: 34px; height: 34px; font-size: 14px; }

  /* --- Section head --- */
  .section-head { margin: 22px 0 12px; }
  .section-head h2 { font-size: 14px; }
  .section-head h2 i { font-size: 12px; }
  .chip-button { padding: 6px 12px; font-size: 11.5px; }

  /* --- Search --- */
  .search {
    height: 46px;
    padding: 0 16px;
    margin-bottom: 14px;
    max-width: 560px;
  }
  .search input { font-size: 13.5px; }
  .search i { font-size: 14px; }

  /* --- List items --- */
  .list-item { padding: 12px 16px !important; min-height: 62px; }
  .list-title { font-size: 13px; }
  .list-sub { font-size: 11px; }
  .list-amount { font-size: 13px; }
  .list-avatar { width: 40px; height: 40px; font-size: 14px; }

  /* --- Produk → grid kartu --- */
  #itemList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
    align-items: start;
  }
